<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer With Us - Kakelo Unity CBO</title>
    
    <!-- Favicon -->
    <link rel="icon" href="Kakelo Unity Logo (2).png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Navbar & Footer -->
    <script src="navbar.js" defer></script>
    <script src="footer.js" defer></script>
    
    <style>
        .volunteer-card {
            animation: fadeInUp 0.7s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-input {
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.15);
        }
    </style>
</head>

<body class="bg-slate-50 font-sans">

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- HERO SECTION -->
    <section class="bg-teal-800 text-white py-24 text-center">
        <div class="max-w-4xl mx-auto px-6">
            <h1 class="text-5xl md:text-6xl font-bold tracking-tight mb-6">
                Volunteer With Us
            </h1>
            <p class="text-xl text-teal-100 max-w-2xl mx-auto">
                Join our passionate team and make a real difference in the lives of youth, 
                families, and communities in Homabay County.
            </p>
        </div>
    </section>

    <!-- VOLUNTEER FORM -->
    <section class="py-20">
        <div class="max-w-3xl mx-auto px-6">
            <div class="volunteer-card bg-white rounded-3xl shadow-xl p-10 md:p-14">

                <h2 class="text-3xl font-bold text-teal-800 text-center mb-10">
                    Tell Us About Yourself
                </h2>

                <form id="volunteerForm" class="space-y-8">
                    
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Full Name *</label>
                            <input type="text" id="fullName" required
                                   class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg"
                                   placeholder="Enter your full name">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Phone Number *</label>
                            <input type="tel" id="phone" required
                                   class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg"
                                   placeholder="+254 7XX XXX XXX">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email Address *</label>
                        <input type="email" id="email" required
                               class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg"
                               placeholder="your@email.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Area of Interest</label>
                        <select id="interest" 
                                class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg">
                            <option value="">Select an area</option>
                            <option value="youth">Youth Empowerment & Leadership</option>
                            <option value="education">Education Support & Mentorship</option>
                            <option value="economic">Economic Empowerment & Entrepreneurship</option>
                            <option value="outreach">Community Outreach</option>
                            <option value="agriculture">Agricultural Initiatives</option>
                            <option value="health">Health Awareness Campaigns</option>
                            <option value="general">General Volunteering</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Why do you want to volunteer with us? *</label>
                        <textarea id="reason" rows="5" required
                                  class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg resize-y"
                                  placeholder="I want to contribute my skills because..."></textarea>
                    </div>

                    <button type="submit"
                            class="w-full bg-teal-700 hover:bg-teal-800 active:bg-teal-900 text-white py-5 rounded-2xl font-semibold text-lg transition-all shadow-lg hover:shadow-xl">
                        Submit Application
                    </button>
                </form>

                <p class="text-center text-sm text-slate-500 mt-10">
                    Our team will review your application and get back to you within 3–5 working days.
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/254707118312" target="_blank"
       class="whatsapp-float fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl text-3xl transition-all z-50">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Scroll to Top -->
    <button id="scrollTopBtn" 
            onclick="scrollToTop()" 
            class="fixed bottom-24 right-6 bg-teal-700 hover:bg-teal-800 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-all hidden z-40">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Scripts -->
    <script src="./ui.js"></script>
    <script src="footer.js"></script>

    <!-- Form Submission Feedback -->
    <script>
        document.getElementById("volunteerForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const btn = this.querySelector("button");
            const originalText = btn.textContent;

            btn.innerHTML = `
                <span class="inline-block animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full mr-3"></span>
                Submitting Application...
            `;
            btn.disabled = true;

            // Simulate form submission
            setTimeout(() => {
                alert("✅ Thank you for your interest in volunteering!\n\nYour application has been received. We will contact you soon.");
                this.reset();
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 1800);
        });
    </script>

</body>
</html>
