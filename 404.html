<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Kakelo Unity CBO</title>
    
    <!-- Favicon -->
    <link rel="icon" href="Kakelo Unity Logo (2).png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Optional: Custom CSS if needed later -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        .error-container {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen px-6 font-sans">

    <div class="error-container text-center max-w-md mx-auto">
        
        <!-- Logo -->
        <img src="Kakelo Unity Logo (2).png" 
             alt="Kakelo Unity CBO Logo" 
             class="h-20 mx-auto mb-8">

        <!-- 404 Number -->
        <h1 class="text-[6.5rem] font-bold text-teal-700 leading-none mb-2 tracking-tighter">
            404
        </h1>
        
        <!-- Message -->
        <h2 class="text-2xl font-semibold text-slate-800 mb-3">
            Oops! Page Not Found
        </h2>
        <p class="text-slate-600 text-lg mb-10">
            The page you are looking for might have been moved, deleted, or is temporarily unavailable.
        </p>

        <!-- Button -->
        <a href="index.html" 
           class="inline-block bg-teal-700 hover:bg-teal-800 active:bg-teal-900 
                  text-white px-10 py-4 rounded-full font-semibold text-lg 
                  transition-all duration-300 shadow-lg hover:shadow-xl">
            ← Return to Home
        </a>

    </div>

</body>
</html>
