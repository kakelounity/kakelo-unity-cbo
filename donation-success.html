<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful | Kakelo Unity CBO</title>
    
    <!-- Favicon -->
    <link rel="icon" href="Kakelo Unity Logo (2).png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (for WhatsApp & icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        .success-container {
            animation: fadeInScale 0.6s ease-out forwards;
        }
        
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .success-icon {
            animation: checkPop 0.8s ease-out forwards;
        }
        
        @keyframes checkPop {
            0%   { transform: scale(0); }
            50%  { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen px-6 font-sans">

    <div class="success-container bg-white rounded-3xl shadow-2xl p-12 max-w-md w-full text-center">
        
        <!-- Success Icon -->
        <div class="mx-auto mb-8 w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-circle-check success-icon text-7xl"></i>
        </div>

        <!-- Logo -->
        <img src="Kakelo Unity Logo (2).png" 
             alt="Kakelo Unity CBO Logo" 
             class="h-16 mx-auto mb-6">

        <!-- Thank You Message -->
        <h1 class="text-4xl font-bold text-teal-800 mb-3">
            Thank You!
        </h1>
        
        <p class="text-xl text-slate-600 mb-10 leading-relaxed">
            Your generous donation has been received successfully.<br>
            <span class="font-medium text-teal-700">We are deeply grateful for your support.</span>
        </p>

        <!-- Action Buttons -->
        <div class="space-y-4">
            <a href="index.html" 
               class="block w-full bg-teal-700 hover:bg-teal-800 active:bg-teal-900 
                      text-white py-4 rounded-2xl font-semibold text-lg transition-all duration-300 shadow-lg hover:shadow-xl">
                ← Return to Home
            </a>
            
            <a href="programs.html" 
               class="block w-full border border-teal-700 text-teal-700 hover:bg-teal-50 
                      py-4 rounded-2xl font-semibold text-lg transition-all duration-300">
                See Our Programs
            </a>
        </div>

        <!-- Appreciation Note -->
        <p class="text-sm text-slate-500 mt-10">
            Your contribution helps us empower youth, support education, 
            and build stronger communities in Homabay County.
        </p>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/254707118312" target="_blank"
       class="whatsapp-float fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl text-3xl transition-all z-50">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Scroll to Top Button -->
    <button id="scrollTopBtn" 
            onclick="scrollToTop()" 
            class="fixed bottom-24 right-6 bg-teal-700 hover:bg-teal-800 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-all hidden z-40">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Scripts -->
    <script src="./ui.js"></script>

</body>
</html>
