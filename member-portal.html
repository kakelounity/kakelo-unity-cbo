<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakelo Unity CBO - Member Portal</title>

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <link rel="icon" href="Kakelo Unity Logo (2).png">
</head>

<body class="bg-slate-100">

<!-- LOGIN -->
<div id="login-screen" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
        <img src="Kakelo Unity Logo (2).png" class="mx-auto h-20 mb-6">
        <h2 class="text-3xl font-bold text-teal-800 mb-6">Kakelo Unity CBO</h2>

        <form id="loginForm" class="space-y-4">
            <input id="memberId" class="w-full p-4 border rounded-xl" placeholder="Member ID" required>
            <input id="password" type="password" class="w-full p-4 border rounded-xl" placeholder="Password" required>

            <button id="loginBtn" class="w-full bg-teal-700 text-white py-4 rounded-xl">
                <span id="loginText">Login</span>
                <span id="loginSpinner" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
            </button>
        </form>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden max-w-6xl mx-auto p-6">

<header class="flex justify-between mb-6">
    <h2 id="welcome" class="text-2xl font-bold text-teal-800"></h2>
    <button onclick="logout()" class="text-red-600">Logout</button>
</header>

<!-- PROFILE -->
<div class="bg-white p-6 rounded-2xl shadow mb-6">
    <h3 id="name" class="text-xl font-bold"></h3>
    <p id="role" class="text-teal-600"></p>
</div>

<!-- SAVINGS -->
<div class="bg-white p-6 rounded-2xl shadow mb-6">
    <h3 class="font-bold mb-4">Savings</h3>
    <div id="savingsHistory"></div>
</div>

<!-- ADMIN -->
<div id="adminSection" class="hidden bg-white p-6 rounded-2xl shadow">
    <h3 class="text-xl font-bold text-amber-700 mb-4">Admin Panel</h3>

    <p>Total Savings: <span id="adminSavings"></span></p>
    <p>Total Expenses: <span id="adminExpenses"></span></p>
</div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRuiKTuA3nnYAJtD3ZpXQTVyJddrPWjL8cdVsGobAMqlzHMsqMX9sIEbMdhX-vs0XI/exec";

// ================= SESSION =================
const SESSION_TIME = 5 * 60 * 1000;

function startSession(){
    localStorage.setItem("loginTime", Date.now());
}

function checkSession(){
    const loginTime = localStorage.getItem("loginTime");
    if(!loginTime) return;

    if(Date.now() - loginTime > SESSION_TIME){
        alert("Session expired");
        logout();
    }
}
setInterval(checkSession,10000);

// ================= LOGIN =================
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
    e.preventDefault();

    const memberId = document.getElementById("memberId").value.toUpperCase();
    const password = document.getElementById("password").value;

    const res = await fetch(WEB_APP_URL,{
        method:"POST",
        body:new URLSearchParams({action:"login",memberId,password})
    });

    const data = await res.json();

    if(!data.success){
        alert("Login failed");
        return;
    }

    localStorage.setItem("data",JSON.stringify(data));
    startSession();
    showDashboard(data);
});

// AUTO LOGIN
window.onload = ()=>{
    const stored = localStorage.getItem("data");
    if(stored){
        showDashboard(JSON.parse(stored));
    }
};

// ================= ROLES =================
function isAdmin(role){
    return ["Chairperson","Vice Chair","Secretary","Treasurer"].includes(role);
}

function isTreasurer(role){
    return role === "Treasurer";
}

// ================= DASHBOARD =================
function showDashboard(data){
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    const m = data.member;

    document.getElementById("welcome").innerText = "Welcome " + m.fullName;
    document.getElementById("name").innerText = m.fullName;
    document.getElementById("role").innerText = m.role;

    renderSavings(data.savingsHistory || []);

    if(isAdmin(m.role)){
        document.getElementById("adminSection").classList.remove("hidden");
        loadAdmin();
    }
}

// ================= SAVINGS =================
function renderSavings(list){
    const role = JSON.parse(localStorage.getItem("data")).member.role;

    document.getElementById("savingsHistory").innerHTML = list.map(s=>`
        <div class="border p-3 mb-3 rounded-xl flex justify-between">
            <span>${s.transactionId} - KSh ${s.amount}</span>

            ${isTreasurer(role)?`
                <div>
                    <button onclick="editRecord('${s.transactionId}')">✏️</button>
                    <button onclick="deleteRecord('${s.transactionId}')">🗑️</button>
                </div>
            `:""}
        </div>
    `).join("");
}

// ================= TREASURER =================
function editRecord(id){
    const amount = prompt("New amount:");
    if(!amount) return;

    fetch(WEB_APP_URL,{
        method:"POST",
        body:new URLSearchParams({action:"editRecord",id,amount})
    }).then(()=>location.reload());
}

function deleteRecord(id){
    if(!confirm("Delete?")) return;

    fetch(WEB_APP_URL,{
        method:"POST",
        body:new URLSearchParams({action:"deleteRecord",id})
    }).then(()=>location.reload());
}

// ================= ADMIN =================
async function loadAdmin(){
    const res = await fetch(WEB_APP_URL + "?action=getAdminData");
    const data = await res.json();

    document.getElementById("adminSavings").innerText = data.totalSavings;
    document.getElementById("adminExpenses").innerText = data.totalExpenses;
}

// ================= LOGOUT =================
function logout(){
    localStorage.clear();
    location.reload();
}
</script>

</body>
</html>
