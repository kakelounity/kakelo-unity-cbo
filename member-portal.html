<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Member Portal</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gray-100 p-4">

<div id="login-screen" class="max-w-md mx-auto bg-white p-6 rounded">
<h2 class="text-xl mb-4">Login</h2>

<form id="loginForm">
<input id="memberId" class="w-full p-2 border mb-2" placeholder="Member ID">
<input id="password" type="password" class="w-full p-2 border mb-2" placeholder="Password">
<button class="bg-teal-600 text-white p-2 w-full">Login</button>
</form>
</div>

<div id="dashboard" class="hidden max-w-6xl mx-auto">

<h2 id="welcome"></h2>

<button onclick="logout()" class="bg-red-500 text-white p-2">Logout</button>
<button onclick="downloadPDF()" class="bg-blue-500 text-white p-2">PDF</button>
<button onclick="emailStatement()" class="bg-green-500 text-white p-2">Email</button>

<div class="bg-white p-4 mt-4">
<h3 id="name"></h3>
<img id="photo" width="100">
<p id="role"></p>
<p id="phone"></p>
<p id="email"></p>
</div>

<h3>Savings</h3>
<div id="savingsHistory"></div>

<h3>Loans</h3>
<div id="loanHistory"></div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRuiKTuA3nnYAJtD3ZpXQTVyJddrPWjL8cdVsGobAMqlzHMsqMX9sIEbMdhX-vs0XI/exec";

document.getElementById("loginForm").addEventListener("submit", async e=>{
e.preventDefault();

const memberId = document.getElementById("memberId").value.toUpperCase();
const password = document.getElementById("password").value;

const res = await fetch(WEB_APP_URL,{
method:"POST",
headers:{"Content-Type":"application/x-www-form-urlencoded"},
body:new URLSearchParams({memberId,password})
});

const data = await res.json();

if(!data.success){
alert(data.message);
return;
}

localStorage.setItem("data", JSON.stringify(data));

showDashboard(data);
});

function showDashboard(data){
document.getElementById("login-screen").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("welcome").textContent = data.member.fullName;

renderSavings(data.savingsHistory);
renderLoans(data.loans);
}

function renderSavings(list){
document.getElementById("savingsHistory").innerHTML = list.map(s=>`
<div>${s.date} | ${s.type} | ${s.amount}</div>
`).join("");
}

function renderLoans(loans){
document.getElementById("loanHistory").innerHTML = loans.map(l=>`
<div>
Loan ${l.loanId} | ${l.date} | ${l.amount} | Outstanding: ${l.outstanding}
</div>
`).join("");
}

function logout(){
localStorage.clear();
location.reload();
}

function downloadPDF(){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const data = JSON.parse(localStorage.getItem("data"));

let y=10;

data.savingsHistory.forEach(s=>{
doc.text(`${s.date} ${s.amount}`,10,y);
y+=10;
});

doc.save("statement.pdf");
}

async function emailStatement(){
const memberId = JSON.parse(localStorage.getItem("data")).member.memberId;
await fetch(`${WEB_APP_URL}?action=emailStatement&memberId=${memberId}`);
alert("Sent");
}
</script>

</body>
</html>
