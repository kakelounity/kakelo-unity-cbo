<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kakelo Unity Portal</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gray-100 p-6">

<div id="login-screen" class="flex justify-center items-center min-h-screen">
<div class="bg-white p-6 rounded shadow w-full max-w-md text-center">

<img src="YOUR_LOGO_URL" class="mx-auto h-20 mb-4">

<form id="loginForm">
<input id="memberId" class="w-full p-2 border mb-2" placeholder="Member ID">
<input id="password" type="password" class="w-full p-2 border mb-2" placeholder="Password">
<button class="bg-teal-600 text-white p-2 w-full">Login</button>
</form>

</div>
</div>

<div id="dashboard" class="hidden max-w-6xl mx-auto">

<h2 id="welcome"></h2>

<button onclick="logout()">Logout</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="emailStatement()">Email</button>

<div>
<img id="photo" width="100">
<p id="name"></p>
<p id="role"></p>
</div>

<h3>Savings</h3>
<div id="savingsHistory"></div>

<h3>Loans</h3>
<div id="loanHistory"></div>

<div id="adminSection" class="hidden">
<h3>Admin Dashboard</h3>

<p>Total Savings: <span id="adminSavings"></span></p>
<p>Total Expenses: <span id="adminExpenses"></span></p>

<canvas id="monthlyChart"></canvas>
<canvas id="rankingChart"></canvas>
</div>

</div>

<script>
const WEB_APP_URL = "PASTE_URL";

document.getElementById("loginForm").addEventListener("submit", async e=>{
e.preventDefault();

const memberId = memberId.value.toUpperCase();
const password = password.value;

const res = await fetch(WEB_APP_URL,{
method:"POST",
body:new URLSearchParams({action:"login",memberId,password})
});

const data = await res.json();
if(!data.success) return alert(data.message);

localStorage.setItem("data", JSON.stringify(data));
showDashboard(data);
});

function showDashboard(data){
login-screen.classList.add("hidden");
dashboard.classList.remove("hidden");

welcome.textContent = data.member.fullName;

renderSavings(data.savingsHistory);
renderLoans(data.loans);

if(data.member.isAdmin){
adminSection.classList.remove("hidden");
loadAdmin();
}
}

function renderSavings(list){
savingsHistory.innerHTML = list.map(s=>`
<div>
${s.transactionId} | ${s.date} | ${s.type} | ${s.notes || ""} | ${s.amount}
</div>
`).join('');
}

function renderLoans(loans){
loanHistory.innerHTML = loans.map(l=>`
<div>${l.loanId} | ${l.amount} | ${l.outstanding}</div>
`).join('');
}

async function loadAdmin(){
const memberId = JSON.parse(localStorage.getItem("data")).member.memberId;

const res = await fetch(`${WEB_APP_URL}?action=getAdminData&memberId=${memberId}`);
const data = await res.json();

adminSavings.textContent = data.adminData.totalSavings;
adminExpenses.textContent = data.adminData.totalExpenses;

new Chart(monthlyChart,{
type:'line',
data:{labels:Object.keys(data.adminData.monthly),
datasets:[{data:Object.values(data.adminData.monthly)}]}
});

new Chart(rankingChart,{
type:'bar',
data:{labels:Object.keys(data.adminData.memberTotals),
datasets:[{data:Object.values(data.adminData.memberTotals)}]}
});
}

function downloadPDF(){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
const data = JSON.parse(localStorage.getItem("data"));

data.savingsHistory.forEach((s,i)=>{
doc.text(`${s.transactionId} ${s.amount}`,10,10+i*10);
});

doc.save("statement.pdf");
}

async function emailStatement(){
const memberId = JSON.parse(localStorage.getItem("data")).member.memberId;
await fetch(`${WEB_APP_URL}?action=emailStatement&memberId=${memberId}`);
alert("Sent");
}

function logout(){
localStorage.clear();
location.reload();
}
</script>

</body>
</html>
