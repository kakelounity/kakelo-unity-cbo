<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kakelo Unity CBO Portal</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body class="bg-slate-100 p-4">

<!-- LOGIN -->
<div id="login-screen" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow">
<h2 class="text-xl font-bold mb-4">Member Login</h2>

<form id="loginForm">
<input id="memberId" class="w-full p-3 border mb-3 rounded" placeholder="Member ID" required>
<input id="password" type="password" class="w-full p-3 border mb-3 rounded" placeholder="Password" required>
<button class="w-full bg-teal-700 text-white p-3 rounded">Login</button>
</form>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden max-w-6xl mx-auto">

<h2 id="welcome" class="text-2xl font-bold mb-4"></h2>

<div class="flex gap-2 flex-wrap mb-4">
<button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
<button onclick="downloadPDF()" class="bg-blue-600 text-white px-4 py-2 rounded">Download PDF</button>
<button onclick="emailStatement()" class="bg-green-600 text-white px-4 py-2 rounded">Email Statement</button>
<button onclick="printCard()" class="bg-purple-600 text-white px-4 py-2 rounded">Member Card</button>
</div>

<!-- PROFILE -->
<div class="bg-white p-6 rounded-2xl shadow mb-6">
<div class="flex flex-col md:flex-row gap-6 items-center">

<img id="photo" src="https://via.placeholder.com/150"
class="w-32 h-32 rounded-full border-4 border-teal-200 object-cover">

<div class="flex-1 text-center md:text-left">
<h3 id="name" class="text-2xl font-bold text-teal-800"></h3>
<p id="role" class="text-teal-600"></p>

<div class="grid grid-cols-2 gap-2 mt-4 text-sm">
<p>📞 <span id="phone"></span></p>
<p>📧 <span id="email"></span></p>
<p>📅 Joined: <span id="join"></span></p>
<p>🆔 ID: <span id="natid"></span></p>
<p>📊 Status: <span id="status"></span></p>
</div>

<!-- PHOTO -->
<div class="mt-4">
<input type="file" accept="image/*" onchange="uploadPhoto(event)">
<button onclick="openCamera()" class="mt-2 bg-gray-700 text-white px-3 py-1 rounded">Camera</button>
</div>

</div>
</div>

<div class="grid md:grid-cols-3 gap-4 mt-6">
<div class="bg-slate-50 p-4 rounded">Savings: <b id="savings"></b></div>
<div class="bg-slate-50 p-4 rounded">Fines: <b id="fines"></b></div>
<div class="bg-slate-50 p-4 rounded">Reg Fees: <b id="regfees"></b></div>
</div>
</div>

<!-- SAVINGS HISTORY -->
<div class="bg-white p-4 rounded shadow mb-4">
<h3 class="font-bold mb-2">Savings History</h3>
<div id="savingsHistory"></div>
</div>

<!-- ADMIN -->
<div id="adminSection" class="hidden bg-white p-4 rounded shadow">
<h3 class="font-bold mb-4">Admin Financial Analytics</h3>

<canvas id="chart"></canvas>
</div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRuiKTuA3nnYAJtD3ZpXQTVyJddrPWjL8cdVsGobAMqlzHMsqMX9sIEbMdhX-vs0XI/exec";

// LOGIN
loginForm.addEventListener('submit', async e=>{
e.preventDefault();

const memberId = document.getElementById("memberId").value.toUpperCase();
const password = document.getElementById("password").value;

const res = await fetch(WEB_APP_URL,{
method:'POST',
headers:{'Content-Type':'application/x-www-form-urlencoded'},
body:new URLSearchParams({action:'login',memberId,password})
});

const data = await res.json();
if(!data.success) return alert(data.message);

localStorage.setItem("data", JSON.stringify(data));
showDashboard(data);
});

// SHOW DASHBOARD
function showDashboard(data){
document.getElementById("login-screen").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

renderProfile(data.member);
renderSavings(data.savingsHistory);

if(data.member.isAdmin){
document.getElementById("adminSection").classList.remove("hidden");
renderChart(data.savingsHistory);
}
}

// PROFILE
function renderProfile(m){
welcome.textContent = "Welcome " + m.fullName;

name.textContent = m.fullName;
role.textContent = m.role;
phone.textContent = m.phone;
email.textContent = m.email;
join.textContent = m.joinDate;
natid.textContent = m.nationalID;
status.textContent = m.status;

savings.textContent = "KSh " + Number(m.totalSavings).toLocaleString();
fines.textContent = "KSh " + Number(m.totalFinesPaid).toLocaleString();
regfees.textContent = "KSh " + Number(m.regFees).toLocaleString();

photo.src = m.photoUrl || "https://via.placeholder.com/150";
}

// SAVINGS HISTORY (WITH DATES ✅)
function renderSavings(list){
savingsHistory.innerHTML = list.map(s=>`
<div class="border-b py-2 flex justify-between">
<span>${s.date}</span>
<span>${s.type}</span>
<span>KSh ${Number(s.amount).toLocaleString()}</span>
</div>
`).join('');
}

// CHART
function renderChart(data){
new Chart(document.getElementById("chart"),{
type:'line',
data:{
labels:data.map(i=>i.date),
datasets:[{
label:'Savings Trend',
data:data.map(i=>i.amount)
}]
}
});
}

// PHOTO PREVIEW
function uploadPhoto(e){
const file = e.target.files[0];
if(!file) return;

const reader = new FileReader();
reader.onload = ()=> photo.src = reader.result;
reader.readAsDataURL(file);
}

// CAMERA (basic)
function openCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(()=> alert("Camera opened (extend capture logic if needed)"));
}

// PDF WITH DATES ✅
function downloadPDF(){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const data = JSON.parse(localStorage.getItem("data"));

let y = 10;

doc.text("Kakelo Unity Statement",10,y); y+=10;
doc.text("Name: "+data.member.fullName,10,y); y+=10;

data.savingsHistory.forEach(s=>{
doc.text(`${s.date} | ${s.type} | KSh ${s.amount}`,10,y);
y+=8;
if(y>280){doc.addPage(); y=10;}
});

doc.save("statement.pdf");
}

// EMAIL
async function emailStatement(){
const memberId = JSON.parse(localStorage.getItem("data")).member.memberId;

const res = await fetch(`${WEB_APP_URL}?action=emailStatement&memberId=${memberId}`);
const data = await res.json();

alert(data.message || "Sent");
}

// MEMBER CARD
function printCard(){
const m = JSON.parse(localStorage.getItem("data")).member;

const win = window.open("","","width=400,height=600");

win.document.write(`
<h2 style="text-align:center;">Kakelo Unity CBO</h2>
<img src="${m.photoUrl}" width="120" style="display:block;margin:auto;">
<p><b>${m.fullName}</b></p>
<p>ID: ${m.memberId}</p>
<p>Status: ${m.status}</p>
`);

win.print();
}

// AUTO LOGIN
window.onload = ()=>{
const saved = localStorage.getItem("data");
if(saved) showDashboard(JSON.parse(saved));
}

// LOGOUT
function logout(){
localStorage.clear();
location.reload();
}
</script>

</body>
</html>
