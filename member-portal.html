<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kakelo Unity CBO Portal</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body class="bg-gray-100 p-6">

<!-- LOGIN -->
<div id="login-screen" class="max-w-md mx-auto bg-white p-6 rounded shadow">
<h2 class="text-xl font-bold mb-4">Member Login</h2>

<form id="loginForm">
<input id="memberId" placeholder="Member ID" class="w-full p-3 border mb-3 rounded" required>
<input id="password" type="password" placeholder="Password" class="w-full p-3 border mb-3 rounded" required>

<button class="bg-teal-600 text-white w-full p-3 rounded">Login</button>
</form>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden max-w-6xl mx-auto">

<h2 id="welcome" class="text-2xl font-bold mb-4"></h2>

<button onclick="logout()" class="mb-4 bg-red-500 text-white px-4 py-2 rounded">Logout</button>

<button onclick="downloadPDF()" class="mb-4 bg-blue-600 text-white px-4 py-2 rounded">
Download Statement
</button>

<!-- PROFILE -->
<div class="bg-white p-4 rounded shadow mb-4">
<p><b>Name:</b> <span id="name"></span></p>
<p><b>Total Savings:</b> <span id="savings"></span></p>
<p><b>Total Fines:</b> <span id="fines"></span></p>
</div>

<!-- SAVINGS -->
<div class="bg-white p-4 rounded shadow mb-4">
<h3 class="font-bold mb-2">Savings History</h3>
<div id="savingsHistory"></div>
</div>

<!-- LOANS -->
<div class="bg-white p-4 rounded shadow mb-4">
<h3 class="font-bold mb-2">Loans</h3>
<div id="loanHistory"></div>
</div>

<!-- EVENTS -->
<div class="bg-white p-4 rounded shadow mb-4">
<h3 class="font-bold mb-2">Events</h3>
<div id="events"></div>
</div>

<!-- ANNOUNCEMENTS -->
<div class="bg-white p-4 rounded shadow mb-4">
<h3 class="font-bold mb-2">Announcements</h3>
<div id="announcements"></div>
</div>

<!-- ADMIN -->
<div id="adminSection" class="hidden bg-yellow-100 p-4 rounded shadow">
<h3 class="font-bold mb-2">Admin Dashboard</h3>
<p>Cash: <span id="cash"></span></p>
<p>Total Savings: <span id="totalSavings"></span></p>
<p>Fines: <span id="totalFines"></span></p>
<p>Expenses: <span id="expenses"></span></p>
</div>

</div>

<script>
const WEB_APP_URL ="https://script.google.com/macros/s/AKfycbzRuiKTuA3nnYAJtD3ZpXQTVyJddrPWjL8cdVsGobAMqlzHMsqMX9sIEbMdhX-vs0XI/exec";

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
e.preventDefault();

const memberId = document.getElementById('memberId').value.trim().toUpperCase();
const password = document.getElementById('password').value.trim();

const res = await fetch(WEB_APP_URL,{
method:'POST',
headers:{'Content-Type':'application/x-www-form-urlencoded'},
body:new URLSearchParams({action:'login',memberId,password})
});

const data = await res.json();

if(!data.success) return alert(data.message);

localStorage.setItem("data", JSON.stringify(data));
showDashboard(data);
});

// SHOW DASHBOARD
function showDashboard(data){
document.getElementById('login-screen').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');

renderProfile(data.member);
renderSavings(data.savingsHistory);
renderLoans(data.loans);
renderEvents(data.events);
renderAnnouncements(data.announcements);

if(data.member.isAdmin){
document.getElementById('adminSection').classList.remove('hidden');
loadAdmin();
}
}

// PROFILE
function renderProfile(m){
document.getElementById('welcome').textContent = "Welcome " + m.fullName;
document.getElementById('name').textContent = m.fullName;
document.getElementById('savings').textContent = "KSh " + m.totalSavings.toLocaleString();
document.getElementById('fines').textContent = "KSh " + m.totalFinesPaid.toLocaleString();
}

// SAVINGS
function renderSavings(list){
const el = document.getElementById('savingsHistory');
el.innerHTML = list.map(i=>`
<div class="border-b py-2">
${i.date} | ${i.type} | KSh ${i.amount}
</div>`).join('');
}

// LOANS
function renderLoans(list){
const el = document.getElementById('loanHistory');
el.innerHTML = list.map(l=>`
<div class="border-b py-2">
Loan: ${l.amount} | ${l.status} | Balance: ${l.balance}
</div>`).join('');
}

// EVENTS
function renderEvents(list){
const el = document.getElementById('events');
el.innerHTML = list.map(e=>`
<div class="border-b py-2">
${e.title} - ${e.date} (${e.location})
</div>`).join('');
}

// ANNOUNCEMENTS
function renderAnnouncements(list){
const el = document.getElementById('announcements');
el.innerHTML = list.map(a=>`
<div class="border-b py-2">
${a.message} (${a.date})
</div>`).join('');
}

// ADMIN LOAD
async function loadAdmin(){
const memberId = JSON.parse(localStorage.getItem("data")).member.memberId;

const res = await fetch(`${WEB_APP_URL}?action=getAdminData&memberId=${memberId}`);
const data = await res.json();

if(!data.success) return;

const a = data.adminData;
document.getElementById('cash').textContent = a.cashInHand;
document.getElementById('totalSavings').textContent = a.totalMemberSavings;
document.getElementById('totalFines').textContent = a.totalFinesCollected;
document.getElementById('expenses').textContent = a.totalExpenses;
}

// PDF
function downloadPDF(){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const data = JSON.parse(localStorage.getItem("data"));
const m = data.member;

let y = 10;
doc.text("Kakelo Unity Statement",10,y); y+=10;
doc.text("Name: "+m.fullName,10,y); y+=10;
doc.text("Savings: "+m.totalSavings,10,y); y+=10;

data.savingsHistory.forEach(s=>{
doc.text(`${s.date} | ${s.type} | ${s.amount}`,10,y);
y+=8;
if(y>280){ doc.addPage(); y=10; }
});

doc.save("statement.pdf");
}

// AUTO LOGIN
window.onload = ()=>{
const saved = localStorage.getItem("data");
if(saved){
showDashboard(JSON.parse(saved));
}
}

// LOGOUT
function logout(){
localStorage.clear();
location.reload();
}
</script>

</body>
</html>
