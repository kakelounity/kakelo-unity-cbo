<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard | Kakelo Unity CBO</title>
<link rel="icon" href="Kakelo Unity Logo (2).png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="navbar.js" defer></script>
<script src="footer.js" defer></script>
</head>
<body class="bg-slate-100">

<div id="navbar-container"></div>

<section class="max-w-7xl mx-auto px-6 py-12">
  <h1 class="page-title mb-10">Admin Dashboard</h1>

  <div class="grid md:grid-cols-3 gap-6 mb-10">
    <div class="bg-white p-6 rounded-3xl shadow">
      <h3 class="text-slate-500 text-sm">Total Members</h3>
      <p class="text-4xl font-bold text-teal-700 mt-2">152</p>
    </div>
    <div class="bg-white p-6 rounded-3xl shadow">
      <h3 class="text-slate-500 text-sm">Total Savings</h3>
      <p class="text-4xl font-bold text-green-700 mt-2">KSh 1,250,000</p>
    </div>
    <div class="bg-white p-6 rounded-3xl shadow">
      <h3 class="text-slate-500 text-sm">Total Loans Active</h3>
      <p class="text-4xl font-bold text-amber-600 mt-2">KSh 420,000</p>
    </div>
  </div>

  <div class="bg-white p-8 rounded-3xl shadow">
    <h3 class="text-xl font-bold text-teal-800 mb-6">Monthly Savings Trend</h3>
    <canvas id="adminChart"></canvas>
  </div>
</section>

<div id="footer-container"></div>

<script>
new Chart(document.getElementById("adminChart"), {
  type: "line",
  data: {
    labels: ["Jan","Feb","Mar","Apr","May","Jun"],
    datasets: [{
      label: "Savings",
      data: [100000,120000,150000,130000,170000,200000],
      borderColor: "#0f766e",
      tension: 0.4
    }]
  }
});
</script>

<a href="https://wa.me/254707118312" target="_blank" class="whatsapp-float">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<!-- SCROLL TO TOP -->
<button id="scrollTopBtn" onclick="scrollToTop()">
  <i class="fa-solid fa-arrow-up"></i>
</button>

<script src="./ui.js"></script>
<div id="footer-container"></div>
<script src="footer.js"></script>
</body>
</html>
