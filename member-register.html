<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Member - Kakelo Unity CBO</title>
    
    <!-- Favicon -->
    <link rel="icon" href="Kakelo Unity Logo (2).png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Navbar & Footer -->
    <script src="navbar.js" defer></script>
    <script src="footer.js" defer></script>
    
    <style>
        .form-input {
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.15);
        }
    </style>
</head>

<body class="bg-white text-slate-800 font-sans">

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- HERO -->
    <section class="bg-white py-24 border-b">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <h1 class="text-5xl md:text-6xl font-bold tracking-tight mb-6 text-teal-800">
                Become a Member
            </h1>
            <p class="text-xl text-slate-600 max-w-3xl mx-auto">
                Join Kakelo Unity CBO and be part of a movement dedicated to youth empowerment, 
                education, and community development.
            </p>
        </div>
    </section>

    <!-- REGISTRATION FORM -->
    <section class="py-20 bg-slate-50">
        <div class="max-w-3xl mx-auto px-6">
            <div class="bg-white rounded-3xl shadow-xl p-10 md:p-14">

                <h2 class="text-3xl font-bold text-teal-800 text-center mb-10">
                    Member Registration Form
                </h2>

                <form id="registrationForm" class="space-y-8">
                    
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Full Name *</label>
                            <input type="text" id="fullName" name="fullName" required
                                   class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg"
                                   placeholder="Enter your full name">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">National ID Number *</label>
                            <input type="text" id="nationalId" name="nationalId" maxlength="8" required
                                   class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg"
                                   placeholder="12345678">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required
                                   class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg"
                                   placeholder="+254 7XX XXX XXX">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
                            <input type="email" id="email" name="email"
                                   class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg"
                                   placeholder="your@email.com">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Date of Birth *</label>
                        <input type="date" id="dob" name="dob" required
                               class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Gender</label>
                        <div class="flex gap-8">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="gender" value="Male" class="w-5 h-5 accent-teal-700">
                                <span class="text-slate-700">Male</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="gender" value="Female" class="w-5 h-5 accent-teal-700">
                                <span class="text-slate-700">Female</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Why do you want to join Kakelo Unity CBO? (Optional)</label>
                        <textarea id="reason" name="reason" rows="4"
                                  class="form-input w-full px-6 py-4 border border-slate-300 rounded-2xl focus:outline-none text-lg resize-y"
                                  placeholder="I want to contribute to youth empowerment..."></textarea>
                    </div>

                    <button type="submit" id="submitBtn"
                            class="w-full bg-teal-700 hover:bg-teal-800 active:bg-teal-900 text-white py-5 rounded-2xl font-semibold text-lg transition-all shadow-lg hover:shadow-xl">
                        Submit Registration
                    </button>
                </form>

                <p class="text-center text-sm text-slate-500 mt-10">
                    After submission, our team will review your application and contact you within 48 hours.
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Floating WhatsApp -->
    <a href="https://wa.me/254707118312" target="_blank"
       class="whatsapp-float fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl text-3xl transition-all z-50">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Scripts -->
    <script src="./ui.js"></script>
    <script src="footer.js"></script>

    <!-- Form Handling Script -->
    <script>
        const form = document.getElementById("registrationForm");
        const submitBtn = document.getElementById("submitBtn");
        const originalBtnText = submitBtn.innerHTML;

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            submitBtn.innerHTML = `
                <span class="inline-block animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full mr-3"></span>
                Submitting...
            `;
            submitBtn.disabled = true;

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.action = "registerMember";

            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbzRuiKTuA3nnYAJtD3ZpXQTVyJddrPWjL8cdVsGobAMqlzHMsqMX9sIEbMdhX-vs0XI/exec", {
                    method: "POST",
                    body: JSON.stringify(data),
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    redirect: "follow"
                });

                const text = await response.text();
                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    result = { success: false, message: "Server error - please try again" };
                }

                if (result.success) {
                    alert("✅ Registration submitted successfully!\n\nOur team will review your application and contact you within 48 hours.");
                    form.reset();
                } else {
                    alert("❌ " + (result.message || "Submission failed. Please try again."));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Failed to connect to server.\n\nPlease make sure the Google Apps Script is correctly deployed as 'Anyone'.\n\nIf still failing, contact us on WhatsApp: +254 707 118 312");
            }

            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
        });
    </script>

</body>
</html>
